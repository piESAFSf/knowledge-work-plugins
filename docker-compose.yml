version: '3.9'
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: saas
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports: ['5432:5432']

  redis:
    image: redis:7
    ports: ['6379:6379']

  backend:
    build: ./backend
    env_file: .env
    depends_on: [db, redis]
    volumes:
      - ./backend:/app
    command: gunicorn -k uvicorn.workers.UvicornWorker -w 4 -b 0.0.0.0:8000 app.main:app

  worker:
    build: ./backend
    env_file: .env
    depends_on: [backend, redis]
    command: celery -A app.tasks.ai_tasks worker --loglevel=info

  frontend:
    build: ./frontend

  nginx:
    image: nginx:1.27-alpine
    depends_on: [frontend, backend]
    ports: ['80:80']
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  pg_data:
